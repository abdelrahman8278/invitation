<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Gold Gradient for Left Ring -->
    <linearGradient id="goldGroom" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3"/>
      <stop offset="30%" stop-color="#E5B947"/>
      <stop offset="70%" stop-color="#C58C1E"/>
      <stop offset="100%" stop-color="#7A4F05"/>
    </linearGradient>

    <!-- Gold Gradient for Bride Ring -->
    <linearGradient id="goldBride" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF8D1"/>
      <stop offset="25%" stop-color="#FCD34D"/>
      <stop offset="65%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>

    <!-- Diamond Facet Gradients -->
    <linearGradient id="diamondTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>

    <linearGradient id="diamondSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1"/>
      <stop offset="40%" stop-color="#FDE047" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow Filter -->
    <filter id="ringShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Left Ring (Groom's Ring - Underneath overlap) -->
  <g filter="url(#ringShadow)">
    <circle cx="50" cy="74" r="32" fill="none" stroke="url(#goldGroom)" stroke-width="9"/>
    <!-- Inner soft highlight -->
    <circle cx="50" cy="74" r="32" fill="none" stroke="#FFFBEB" stroke-width="1.2" opacity="0.6"/>
  </g>

  <!-- Right Ring (Bride's Ring with Diamond) -->
  <g filter="url(#ringShadow)">
    <!-- Main Ring Band -->
    <circle cx="78" cy="70" r="32" fill="none" stroke="url(#goldBride)" stroke-width="9"/>
    <circle cx="78" cy="70" r="32" fill="none" stroke="#FFFDF5" stroke-width="1.2" opacity="0.7"/>

    <!-- Interlocking Overlap Fix: Re-drawing upper arc of left ring over right ring for true 3D interlock -->
    <path d="M 50 42 A 32 32 0 0 1 80 62" fill="none" stroke="url(#goldGroom)" stroke-width="9"/>
    <path d="M 50 42 A 32 32 0 0 1 80 62" fill="none" stroke="#FFFBEB" stroke-width="1.2" opacity="0.6"/>

    <!-- Diamond Setting Crown (Gold Prongs) -->
    <path d="M 72 37 L 75 30 L 81 30 L 84 37 Z" fill="#F59E0B"/>
    <path d="M 74 38 L 78 32 L 82 38 Z" fill="#FEF08A"/>

    <!-- Brilliant Diamond Crystal -->
    <!-- Table (flat top facet) -->
    <polygon points="72,24 84,24 88,30 68,30" fill="url(#diamondTop)"/>
    <!-- Crown facets -->
    <polygon points="68,30 78,41 74,30" fill="url(#diamondSide)"/>
    <polygon points="88,30 78,41 82,30" fill="url(#diamondSide)"/>
    <polygon points="74,30 78,41 82,30" fill="#E0F2FE"/>
    <polygon points="72,24 74,30 78,24" fill="#FFFFFF"/>
    <polygon points="84,24 82,30 78,24" fill="#BAE6FD"/>
  </g>

  <!-- Magic Sparkle 1 (On the Diamond) -->
  <g transform="translate(68, 14)">
    <circle cx="8" cy="8" r="8" fill="url(#sparkleGlow)" opacity="0.9"/>
    <path d="M 8 0 Q 8 8 0 8 Q 8 8 8 16 Q 8 8 16 8 Q 8 8 8 0 Z" fill="#FFFFFF"/>
    <circle cx="8" cy="8" r="1.5" fill="#FEF08A"/>
  </g>

  <!-- Magic Sparkle 2 (Small Sparkle on Ring) -->
  <g transform="translate(24, 52) scale(0.65)">
    <circle cx="8" cy="8" r="7" fill="url(#sparkleGlow)" opacity="0.8"/>
    <path d="M 8 0 Q 8 8 0 8 Q 8 8 8 16 Q 8 8 16 8 Q 8 8 8 0 Z" fill="#FFFFFF"/>
  </g>

  <!-- Magic Sparkle 3 (Delicate Sparkle Top Right) -->
  <g transform="translate(100, 36) scale(0.55)">
    <circle cx="8" cy="8" r="6" fill="url(#sparkleGlow)" opacity="0.75"/>
    <path d="M 8 0 Q 8 8 0 8 Q 8 8 8 16 Q 8 8 16 8 Q 8 8 8 0 Z" fill="#FFFFFF"/>
  </g>

  <!-- Romantic Mini Heart Between Rings -->
  <path d="M 64 74 C 64 70, 60 67, 57 69 C 53 71, 53 76, 57 80 L 64 86 L 71 80 C 75 76, 75 71, 71 69 C 68 67, 64 70, 64 74 Z" fill="#E11D48" opacity="0.9" filter="url(#ringShadow)"/>
  <path d="M 64 75 C 64 72, 61 70, 59 71 C 56 72, 56 75, 59 78 L 64 82 L 69 78 C 72 75, 72 72, 69 71 C 67 70, 64 72, 64 75 Z" fill="#FB7185" opacity="0.6"/>
</svg>
